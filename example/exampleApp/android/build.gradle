buildscript {
  ext {
    buildToolsVersion = "37.0.0"
    minSdkVersion = 24
    compileSdkVersion = 37
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.2.0"
  }
  repositories {
    google()
    mavenCentral()
    maven { url 'https://developer.huawei.com/repo/' }
  }
  dependencies {
    // The Huawei agconnect plugin needs an explicit Android Gradle plugin version on the classpath.
    // Keep it in sync with node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml
    classpath("com.android.tools.build:gradle:9.2.1")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    classpath 'com.google.gms:google-services:4.3.14'
    classpath "com.huawei.agconnect:agcp:1.9.1.300"
  }
}
allprojects {
  repositories {
    mavenLocal()
    maven { url 'https://developer.huawei.com/repo/' }
    maven { url 'https://nexus-external.rustore.ru/repository/maven-rustore-exposed' }
  }
}

apply plugin: "com.facebook.react.rootproject"
